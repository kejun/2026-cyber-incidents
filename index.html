<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="2026 年网络安全事件记录">
<title>2026 年网络安全事件</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbfa;
    --fg: #1a1a1a;
    --muted: #8a8a85;
    --rule: #e3e3df;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111110;
      --fg: #ececea;
      --muted: #7c7c77;
      --rule: #262624;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    padding: 4rem 1.5rem;
    background: var(--bg);
    color: var(--fg);
    font: 400 17px/1.65 -apple-system, BlinkMacSystemFont, "Helvetica Neue",
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 34rem;
    margin: 0 auto;
  }
  h1 {
    margin: 0 0 .35rem;
    font-size: 1.6rem;
    font-weight: 600;
    letter-spacing: -.01em;
  }
  .sub {
    margin: 0;
    color: var(--muted);
    font-size: .8rem;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  hr {
    margin: 2.5rem 0;
    border: 0;
    border-top: 1px solid var(--rule);
  }
  .empty {
    margin: 0;
    color: var(--muted);
  }
  footer {
    margin-top: 4rem;
    color: var(--muted);
    font-size: .8rem;
  }
</style>
</head>
<body>
  <main>
    <h1>2026 年网络安全事件</h1>
    <p class="sub">Cybersecurity Incidents of 2026</p>

    <hr>

    <p class="empty">内容筹备中。</p>

    <footer>最后更新：2026 年 10 月</footer>
  </main>
</body>
</html>
